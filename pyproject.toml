[project]
name = "deepfakedet"
version = "0.1.0"
description = "Using ViT + LoRA to detect deepfakes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "kaggle>=2.1.2",
    "lightning>=2.6.1",
    "mlflow>=3.12.0",
    "omegaconf>=2.3.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "pandas>=2.3.3",
    "peft>=0.19.1",
    "pillow>=12.2.0",
    "torch>=2.12.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N812", "N806"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["N"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=deepfakedet --cov-report=term-missing"
